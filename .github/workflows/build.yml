name: Bygg APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bygg APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Döp om APK
        run: cp app/build/outputs/apk/release/app-release.apk TheWindow-${{ github.run_number }}.apk

      - name: Ladda upp som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: TheWindow-${{ github.run_number }}
          path: TheWindow-${{ github.run_number }}.apk

      - name: Publicera som release (lätt att ladda ner på mobilen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: The Window ${{ github.run_number }}
          body: Bygge från ${{ github.sha }}. Ladda ner APK-filen nedan och installera den ovanpå den förra versionen – världen sparas.
          files: TheWindow-${{ github.run_number }}.apk
          make_latest: true
